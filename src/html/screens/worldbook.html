        <div id="edit-world-book-screen" class="screen">
            <header class="app-header">
                <button class="back-btn" data-target="world-book-screen">‹</button>
                <div class="title-container">
                    <h1 class="title" id="edit-world-book-title">创建/编辑条目</h1>
                </div>
                <div class="placeholder"></div>
            </header>
            <main class="content">
                <form id="edit-world-book-form">
                    <input type="hidden" id="world-book-id">
                    <div class="form-group">
                        <label for="world-book-name">条目名称</label>
                        <input type="text" id="world-book-name" placeholder="例如：世界观背景、魔法体系" required>
                    </div>
                    <div class="form-group">
                        <label for="world-book-category">条目分类 <span style="font-size:12px;color:#999;font-weight:normal;">(使用/创建子分类，如: 魔法/法术)</span></label>
                        <input type="text" id="world-book-category" placeholder="例如：人物、地点、组织（可选）">
                    </div>
                    <div class="form-group">
                        <label for="world-book-tags">标签 <span style="font-size:12px;color:#999;font-weight:normal;">(多个标签用逗号分隔)</span></label>
                        <input type="text" id="world-book-tags" placeholder="例如：设定, 核心, 剧透">
                    </div>
                    <div class="form-group">
                        <label for="world-book-content">条目内容</label>
                        <textarea id="world-book-content" rows="8" placeholder="详细描述此项设定..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>注入位置</label>
                        <div class="form-group radio-group">
                            <label><input type="radio" name="world-book-position" value="before" checked> 前</label>
                            <label><input type="radio" name="world-book-position" value="middle"> 中</label>
                            <label><input type="radio" name="world-book-position" value="after"> 后</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label style="display: flex; align-items: center; justify-content: space-between;">
                            <span>全局世界书</span>
                            <label class="kkt-switch" style="margin: 0;">
                                <input type="checkbox" id="world-book-global">
                                <span class="kkt-slider"></span>
                            </label>
                        </label>
                        <p style="font-size: 12px; color: #999; margin-top: 5px;">
                            开启后，此条目将自动应用到所有角色
                        </p>
                    </div>
                    <div class="form-group">
                        <label style="display: flex; align-items: center; justify-content: space-between;">
                            <span>常驻 (Always-on)</span>
                            <label class="kkt-switch" style="margin: 0;">
                                <input type="checkbox" id="world-book-always-on" checked>
                                <span class="kkt-slider"></span>
                            </label>
                        </label>
                        <p style="font-size: 12px; color: #999; margin-top: 5px;">
                            开启后无视关键词，每次对话必定注入
                        </p>
                    </div>
                    <div class="form-group" id="world-book-keywords-group" style="display: none;">
                        <label for="world-book-keywords">触发关键词</label>
                        <input type="text" id="world-book-keywords" placeholder="用逗号分隔，如：魔法,火球术">
                        <p style="font-size: 12px; color: #999; margin-top: 5px;">
                            当最近聊天记录包含这些关键词之一时，该条目才会被触发注入
                        </p>
                    </div>
                    <div class="form-group">
                        <label for="world-book-weight">权重 (越小排越上，越大排越下，默认 100)</label>
                        <input type="number" id="world-book-weight" placeholder="100" value="100">
                        <p style="font-size: 12px; color: #999; margin-top: 5px;">
                            同位置分组内按权重排序。AI对越靠下的内容记忆越深，核心设定建议填高权重。
                        </p>
                    </div>
                    <button type="submit" class="btn btn-primary">保存条目</button>
                </form>
            </main>
        </div>
